<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title> TOY開獎BAR </title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        /* 核心對齊寬度：580px */
        .container-width { width: 580px; box-sizing: border-box; }

        /* 設定區域 */
        .setup-area { display: flex; gap: 12px; background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; justify-content: space-between; }
        textarea { width: 165px; height: 110px; background: #111; color: #0f0; border: 1px solid #444; border-radius: 5px; padding: 8px; font-size: 13px; line-height: 1.4; resize: none; }
        .label { text-align: center; margin-bottom: 5px; color: #f1c40f; font-weight: bold; font-size: 14px; }
        
        .option-box { background: #222; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; border: 1px solid #444; flex-grow: 1; justify-content: space-between; }

        /* 拉霸主體 */
        .slot-machine-wrap { display: flex; gap: 20px; margin: 15px 0; justify-content: center; }
        .window { width: 220px; height: 100px; border: 4px solid #444; border-radius: 10px; background: #fff; position: relative; overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .reel { position: absolute; top: 0; left: 0; width: 100%; transition: top 0.6s cubic-bezier(0.2, 0, 0.2, 1); }
        .slot-item { height: 100px; display: flex; align-items: center; justify-content: center; color: #222; font-size: 20px; font-weight: bold; text-align: center; padding: 0 10px; overflow: hidden; }
        
        /* 按鈕組 (對齊核心寬度) */
        .button-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px 0; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; color: white; transition: 0.2s; flex: 1; /* 平分 580px */ }
        .btn-single { background: #3498db; }
        .btn-ten { background: #9b59b6; }
        .btn-all { background: #e74c3c; }
        .btn-clear { background: #555; font-size: 11px; padding: 5px; margin-top: 5px; width: 100%; }
        .btn-clear:hover { background: #c0392b; }
        button:disabled { background: #444 !important; cursor: not-allowed; }

        /* 大獎特效 */
        @keyframes jackpot-shake { 0% { transform: scale(1.05); } 50% { transform: scale(1.1); } 100% { transform: scale(1.05); } }
        .big-win-active { border: 4px solid #f1c40f !important; box-shadow: 0 0 40px #f1c40f !important; animation: jackpot-shake 0.1s infinite !important; }
        
        /* 紀錄區 (對齊核心寬度) */
        .log-container { background: #111; border: 2px solid #333; border-radius: 10px; position: relative; overflow: hidden; margin-bottom: 50px; }
        .log-header { background: #222; color: #f1c40f; padding: 12px; font-weight: bold; text-align: center; border-bottom: 2px solid #333; font-size: 16px; }
        #result-log { min-height: 900px; padding: 10px; font-family: 'Consolas', 'Monaco', monospace; }
        .log-item { border-bottom: 1px solid #222; padding: 10px 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .log-big { background: rgba(241, 196, 15, 0.12); color: #f1c40f; font-weight: bold; border-left: 4px solid #f1c40f; }
        .log-time { color: #777; font-size: 12px; min-width: 125px; white-space: nowrap; }
        .highlight-num { color: #0f0; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color: #f1c40f; margin-bottom: 15px;">🎰 TOY開獎BAR </h2>

    <div class="setup-area container-width">
        <div>
            <div class="label">玩家名單</div>
            <textarea id="input-players" oninput="autoSync()" placeholder="玩家A*5"></textarea>
        </div>
        <div>
            <div class="label">獎項清單</div>
            <textarea id="input-prizes" oninput="autoSync()" placeholder="【A賞】*1"></textarea>
        </div>
        <div class="option-box">
            <div style="font-weight:bold; color:#f1c40f; border-bottom:1px solid #444; padding-bottom:4px; margin-bottom:4px; font-size:13px;">即時狀態</div>
            <label style="cursor:pointer"><input type="checkbox" id="remove-player" checked> 移除玩家</label>
            <label style="cursor:pointer"><input type="checkbox" id="remove-prize" checked> 移除獎項</label>
            <div style="margin-top:4px; border-top:1px solid #444; padding-top:4px;">剩餘籤數：<span id="total-sum" class="highlight-num">0</span></div>
            <button class="btn-clear" onclick="clearAllData()">🗑️ 一鍵清空全部</button>
        </div>
    </div>

    <div class="slot-machine-wrap container-width">
        <div class="window"><div id="reel-player" class="reel"></div></div>
        <div id="prize-window" class="window"><div id="reel-prize" class="reel"></div></div>
    </div>

    <div class="button-group container-width">
        <button class="btn-single" id="btn-1" onclick="handleDraw(1)">單抽</button>
        <button class="btn-ten" id="btn-10" onclick="handleDraw(10)">十連抽</button>
        <button class="btn-all" id="btn-all" onclick="handleDraw('all')">一次全開</button>
    </div>

    <div class="log-container container-width">
        <div id="log-title" class="log-header">📜 開獎紀錄看板</div>
        <div id="result-log"></div>
    </div>

    <script>
        let players = [];
        let prizes = [];
        let isDrawing = false;

        const today = new Date();
        document.getElementById('log-title').innerText = `📜 開獎紀錄看板 (${today.getFullYear()}/${(today.getMonth()+1).toString().padStart(2,'0')}/${today.getDate().toString().padStart(2,'0')})`;

        function autoSync() {
            if (isDrawing) return;
            players = parseToData(document.getElementById('input-players').value);
            prizes = parseToData(document.getElementById('input-prizes').value);
            const zTotal = prizes.reduce((sum, item) => sum + item.count, 0);
            document.getElementById('total-sum').innerText = zTotal;
        }

        function parseToData(text) {
            let result = [];
            text.split('\n').forEach(line => {
                if (!line.trim()) return;
                let name = "", count = 1;
                if (line.includes('*')) [name, count] = line.split('*');
                else if (line.includes('+')) [name, count] = line.split('+');
                else name = line;
                let n = name.trim();
                let c = parseInt(count) || 1;
                if (n) result.push({ name: n, count: c });
            });
            return result;
        }

        function clearAllData() {
            if (confirm("確定要清空所有名單與紀錄嗎？")) {
                document.getElementById('input-players').value = "";
                document.getElementById('input-prizes').value = "";
                document.getElementById('result-log').innerHTML = "";
                players = [];
                prizes = [];
                autoSync();
                refreshUI();
            }
        }

        function refreshUI() {
            document.getElementById('input-players').value = players.map(p => `${p.name}*${p.count}`).join('\n');
            document.getElementById('input-prizes').value = prizes.map(z => `${z.name}*${z.count}`).join('\n');
            const zTotal = prizes.reduce((sum, item) => sum + item.count, 0);
            document.getElementById('total-sum').innerText = zTotal;
            document.getElementById('reel-player').innerHTML = `<div class="slot-item">READY</div>`;
            document.getElementById('reel-prize').innerHTML = `<div class="slot-item">READY</div>`;
            document.getElementById('reel-player').style.top = '0';
            document.getElementById('reel-prize').style.top = '0';
        }

        function pickRandom(list) {
            let total = list.reduce((sum, item) => sum + item.count, 0);
            if (total === 0) return null;
            let rand = Math.floor(Math.random() * total);
            let runningSum = 0;
            for (let item of list) {
                runningSum += item.count;
                if (rand < runningSum) return item;
            }
            return null;
        }

        async function handleDraw(times) {
            const btns = [document.getElementById('btn-1'), document.getElementById('btn-10'), document.getElementById('btn-all')];
            const textareas = [document.getElementById('input-players'), document.getElementById('input-prizes')];
            isDrawing = true;
            btns.forEach(b => b.disabled = true);
            textareas.forEach(t => t.disabled = true);

            let currentTotal = prizes.reduce((sum, item) => sum + item.count, 0);
            let count = times === 'all' ? currentTotal : times;

            for (let i = 0; i < count; i++) {
                const targetP = pickRandom(players);
                const targetZ = pickRandom(prizes);
                if (!targetP || !targetZ) break;

                await runAnimation(targetP.name, targetZ.name);
                
                if (document.getElementById('remove-player').checked) {
                    targetP.count--;
                    if (targetP.count <= 0) players = players.filter(p => p !== targetP);
                }
                if (document.getElementById('remove-prize').checked) {
                    targetZ.count--;
                    if (targetZ.count <= 0) prizes = prizes.filter(z => z !== targetZ);
                }
                logResult(targetP.name, targetZ.name);
                refreshUI();
                if (times !== 1) await new Promise(r => setTimeout(r, 60)); 
            }
            isDrawing = false;
            btns.forEach(b => b.disabled = false);
            textareas.forEach(t => t.disabled = false);
        }

        function runAnimation(p, z) {
            return new Promise(resolve => {
                const rP = document.getElementById('reel-player'), rZ = document.getElementById('reel-prize');
                const pWin = document.getElementById('prize-window'), isBig = z.includes('【') || z.includes('[');
                pWin.classList.remove('big-win-active');
                const setup = (el, val) => {
                    el.style.transition = 'none'; el.style.top = '0';
                    el.innerHTML = `<div class="slot-item">...</div><div class="slot-item">${val}</div>`;
                    setTimeout(() => { el.style.transition = 'top 0.4s ease-out'; el.style.top = '-100px'; }, 30);
                };
                setup(rP, p); setup(rZ, z);
                setTimeout(() => {
                    if (isBig) {
                        pWin.classList.add('big-win-active');
                        confetti({ particleCount: 150, spread: 80, origin: { y: 0.7 } });
                    }
                    resolve();
                }, 500);
            });
        }

        function logResult(p, z) {
            const log = document.getElementById('result-log');
            const isBig = z.includes('【') || z.includes('[');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            const dateStr = `${now.getMonth()+1}/${now.getDate()}`;
            const div = document.createElement('div');
            div.className = `log-item ${isBig ? 'log-big' : ''}`;
            div.innerHTML = `<span class="log-time">[${dateStr} ${timeStr}]</span> <span><b>${p}</b> ➔ <b>${z}</b> ${isBig ? '🏆' : ''}</span>`;
            log.prepend(div);
        }

        autoSync();
    </script>
</body>
</html>
